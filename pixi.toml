[workspace]
name = "tritonserver-zig-build"
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.63.2"

[system-requirements]
libc = { family = "glibc", version = "2.28" }

[dependencies]
python = "3.12.*"
gcc_linux-64 = "14.*"
gxx_linux-64 = "14.*"
sysroot_linux-64 = "2.28.*"
ninja = "1.13.*"
# The video fixture uses libx264, which is present in the GPL builds.
ffmpeg = { version = "6.1.2.*", build = "gpl_*" }
openssl = "3.*"
pkg-config = "0.29.*"
rapidjson = "1.1.*"
zlib = "1.3.*"
curl = "8.*"
git = "2.*"
tar = "1.*"
unzip = "6.*"
uv = "0.9.*"
xz = "5.*"

[pypi-dependencies]
cmake = "==3.31.10"
